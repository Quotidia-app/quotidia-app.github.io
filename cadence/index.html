<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Cadence — Validation des publications</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23172A3A'/%3E%3Crect x='6' y='12' width='3' height='8' rx='1.5' fill='%234FF0D2'/%3E%3Crect x='11' y='8' width='3' height='16' rx='1.5' fill='%2369E4CB'/%3E%3Crect x='16' y='5' width='3' height='22' rx='1.5' fill='%238CD6B9'/%3E%3Crect x='21' y='9' width='3' height='14' rx='1.5' fill='%23D6C28A'/%3E%3C/svg%3E">
<style>
  :root{--bg:#0f1e2a;--panel:#172A3A;--line:#2c4356;--ink:#F5F3EE;--muted:#9fb0bd;--cyan:#4FF0D2;--or:#F0BE78;--rouge:#ff6b6b;--vert:#5be39a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(15,30,42,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .barre{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:1.2rem;margin-right:auto}
  .logo svg{width:28px;height:28px}
  main{max-width:1100px;margin:0 auto;padding:20px}
  h2{font-size:1.15rem;margin:28px 0 10px;display:flex;gap:10px;align-items:center}
  .compteur{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.85rem;color:var(--muted)}
  button,.btn{font:inherit;border:0;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
  .primaire{background:var(--cyan);color:#0f1e2a}
  .primaire:disabled{opacity:.4;cursor:not-allowed}
  .secondaire{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .danger{background:transparent;color:var(--rouge);border:1px solid #5a2c32}
  .petit{padding:6px 12px;font-size:.88rem}
  .compte{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px}
  .compte img{width:34px;height:34px;border-radius:50%;background:#0b1620}
  .compte b{display:block;line-height:1.1}
  .compte small{color:var(--muted)}
  .alerte{background:#2a2414;border:1px solid #5d4a22;color:#f3d9a4;border-radius:12px;padding:12px 16px;margin:8px 0 16px}
  .info{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;color:var(--muted)}
  .lot select{width:auto;min-width:200px}
  .lot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .carte{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .carte.valide{border-color:#2f6b5b}
  .apercu{display:flex;gap:12px;padding:12px}
  video{width:120px;aspect-ratio:9/16;background:#000;border-radius:10px;object-fit:cover;flex:none}
  .champs{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
  label{font-size:.82rem;color:var(--muted);display:block}
  input[type=datetime-local],select,textarea{width:100%;font:inherit;color:var(--ink);background:#0b1620;border:1px solid var(--line);border-radius:8px;padding:7px 9px}
  textarea{min-height:110px;resize:vertical;font-size:.9rem}
  .bas{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .bascules{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem}
  .bascules label{color:var(--ink);font-size:.9rem;display:flex;gap:6px;align-items:center}
  .consent{font-size:.78rem;color:var(--muted)}
  .consent a{color:var(--cyan)}
  .ligne{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .etiquette{font-size:.78rem;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
  .etiquette.ok{color:var(--vert);border-color:#2f6b5b}
  .etiquette.ko{color:var(--rouge);border-color:#5a2c32}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
  th{color:var(--muted);font-weight:600}
  .vide{color:var(--muted);font-style:italic}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--cyan);color:#0f1e2a;font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none;z-index:10}
  .toast.on{opacity:1}
  .connexion{max-width:560px;margin:40px auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
  .connexion input{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0b1620;color:var(--ink);margin:10px 0}
  ol{padding-left:20px} li{margin:4px 0}
  a{color:var(--cyan)}
</style>
</head>
<body>
<header><div class="barre">
  <div class="logo"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#172A3A"/><rect x="6" y="12" width="3" height="8" rx="1.5" fill="#4FF0D2"/><rect x="11" y="8" width="3" height="16" rx="1.5" fill="#69E4CB"/><rect x="16" y="5" width="3" height="22" rx="1.5" fill="#8CD6B9"/><rect x="21" y="9" width="3" height="14" rx="1.5" fill="#D6C28A"/></svg>Cadence</div>
  <div id="comptes"></div>
  <a id="lienConnexion" class="btn secondaire petit" href="#" hidden>+ Connecter un compte TikTok</a>
  <button id="deconnexion" class="secondaire petit" hidden>Oublier la clé</button>
</div></header>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const DEPOT = 'Quotidia-app/Cadence';
const API = 'https://api.github.com/repos/' + DEPOT + '/contents/';
const REDIRECT = 'https://quotidia-app.github.io/cadence/callback/';
const VISIBILITES = {
  PUBLIC_TO_EVERYONE: 'Tout le monde',
  MUTUAL_FOLLOW_FRIENDS: 'Amis (abonnés mutuels)',
  FOLLOWER_OF_CREATOR: 'Mes abonnés',
  SELF_ONLY: 'Moi uniquement',
};
const MUSIQUE = 'https://www.tiktok.com/legal/page/global/music-usage-confirmation/en';
const MARQUE = 'https://www.tiktok.com/legal/page/global/bc-policy/en';

let jeton = null; try { jeton = localStorage.getItem('cadence_jeton'); } catch (e) {}
let file = [], sha = null, comptes = {}, config = {};
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 2600); }
const b64dec = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g, '')), (c) => c.charCodeAt(0)));
const b64enc = (t) => { const o = new TextEncoder().encode(t); let s = ''; o.forEach((x) => (s += String.fromCharCode(x))); return btoa(s); };

async function gh(chemin, opts = {}) {
  const r = await fetch(API + chemin, { ...opts, headers: { Authorization: 'Bearer ' + jeton, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers || {}) }, cache: 'no-store' });
  if (r.status === 401 || r.status === 403) throw Object.assign(new Error('Clé GitHub refusée'), { auth: true });
  if (!r.ok) throw Object.assign(new Error('GitHub ' + r.status), { status: r.status });
  return r.json();
}

// ---------- écran de connexion GitHub ----------
function ecranCle(message) {
  $('#deconnexion').hidden = true; $('#lienConnexion').hidden = true; $('#comptes').innerHTML = '';
  $('#app').innerHTML = `<div class="connexion">
    <h2 style="margin-top:0">Ouvrir Cadence</h2>
    ${message ? `<p class="alerte">${esc(message)}</p>` : ''}
    <p>Cette page lit et modifie la file d'attente du dépôt privé <b>${DEPOT}</b>. Elle a besoin d'une clé GitHub, gardée seulement dans ce navigateur.</p>
    <ol>
      <li>Ouvre <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a></li>
      <li>Nom : <b>Cadence</b> · Expiration : 1 an · Resource owner : <b>Quotidia-app</b></li>
      <li>Repository access : <b>Only select repositories</b> → <b>Cadence</b></li>
      <li>Permissions → Repository → <b>Contents : Read and write</b></li>
      <li>Generate token, copie-le et colle-le ici :</li>
    </ol>
    <input id="cle" type="password" placeholder="github_pat_…" autocomplete="off">
    <button class="primaire" id="ok">Ouvrir</button>
  </div>`;
  $('#ok').onclick = () => { const v = $('#cle').value.trim(); if (!v) return; jeton = v; try { localStorage.setItem('cadence_jeton', v); } catch (e) {} charger(); };
}

// ---------- chargement ----------
async function charger() {
  if (!jeton) return ecranCle();
  $('#app').innerHTML = '<p class="vide">Chargement…</p>';
  try {
    const [f, c, liste] = await Promise.all([gh('file.json'), gh('config.json'), gh('comptes')]);
    sha = f.sha; file = JSON.parse(b64dec(f.content)); config = JSON.parse(b64dec(c.content));
    comptes = {};
    await Promise.all(liste.filter((x) => x.name.endsWith('.json')).map(async (x) => {
      const d = await gh('comptes/' + x.name); const j = JSON.parse(b64dec(d.content)); comptes[j.compte] = j;
    }));
    afficher();
  } catch (e) {
    if (e.auth) { try { localStorage.removeItem('cadence_jeton'); } catch (_) {} jeton = null; return ecranCle('Cette clé GitHub ne fonctionne pas (expirée ou mauvais droits).'); }
    $('#app').innerHTML = `<p class="alerte">Impossible de charger la file : ${esc(e.message)}</p>`;
  }
}

async function sauver(message) {
  const contenu = JSON.stringify(file, null, 2) + '\n';
  try {
    const r = await gh('file.json', { method: 'PUT', body: JSON.stringify({ message, content: b64enc(contenu), sha }) });
    sha = r.content.sha; toast('Enregistré ✓');
  } catch (e) {
    if (e.status === 409 || e.status === 422) { toast('La file a changé entre-temps : rechargement'); await charger(); }
    else toast('Erreur : ' + e.message);
    throw e;
  }
}

// ---------- affichage ----------
function entete() {
  const cs = Object.values(comptes);
  $('#comptes').innerHTML = cs.map((c) => `<span class="compte"><img src="${esc(c.avatar)}" alt=""><span><b>${esc(c.nom)}</b><small>@${esc(c.pseudo)}</small></span></span>`).join(' ');
  if (config.client_key) {
    const u = 'https://www.tiktok.com/v2/auth/authorize/?' + new URLSearchParams({ client_key: config.client_key, scope: 'user.info.basic,video.publish', response_type: 'code', redirect_uri: REDIRECT, state: 'cadence' });
    $('#lienConnexion').href = u; $('#lienConnexion').hidden = false;
  }
  $('#deconnexion').hidden = false;
}

const dateLocale = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('fr-BE', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const versInput = (iso) => { const d = new Date(iso); if (isNaN(d)) return ''; const p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
const depuisInput = (v) => new Date(v).toISOString();

function optionsVisibilite(c, choisie) {
  const opts = (c?.visibilites?.length ? c.visibilites : Object.keys(VISIBILITES));
  return `<option value="" ${choisie ? '' : 'selected'} disabled>Choisir…</option>` + opts.map((o) => `<option value="${o}" ${o === choisie ? 'selected' : ''}>${VISIBILITES[o] || o}</option>`).join('');
}

function carte(p, i) {
  const c = comptes[p.compte];
  const bloque = (k) => c && c[k];
  return `<div class="carte ${p.valide ? 'valide' : ''}" data-i="${i}">
    <div class="apercu">
      <video src="${esc(p.video)}" controls playsinline preload="metadata"></video>
      <div class="champs">
        <div class="ligne"><span class="etiquette">${esc(c ? '@' + c.pseudo : p.compte)}</span>${p.valide ? '<span class="etiquette ok">Validée</span>' : ''}</div>
        <div><label>Date de publication</label><input type="datetime-local" data-k="date" value="${versInput(p.date)}"></div>
        <div><label>Qui peut voir cette vidéo ?</label><select data-k="confidentialite">${optionsVisibilite(c, p.confidentialite)}</select></div>
      </div>
    </div>
    <div class="bas">
      <div><label>Description (${(p.texte || '').length}/2200)</label><textarea data-k="texte" maxlength="2200">${esc(p.texte)}</textarea></div>
      <div class="bascules">
        <label><input type="checkbox" data-k="commentaires" ${p.commentaires ? 'checked' : ''} ${bloque('commentaires_bloques') ? 'disabled' : ''}> Commentaires</label>
        <label><input type="checkbox" data-k="duo" ${p.duo ? 'checked' : ''} ${bloque('duo_bloque') ? 'disabled' : ''}> Duo</label>
        <label><input type="checkbox" data-k="collage" ${p.collage ? 'checked' : ''} ${bloque('collage_bloque') ? 'disabled' : ''}> Collage</label>
      </div>
      <div class="bascules">
        <label><input type="checkbox" data-k="promo_marque" ${p.promo_marque ? 'checked' : ''}> Promeut ma propre marque</label>
        <label><input type="checkbox" data-k="contenu_sponsorise" ${p.contenu_sponsorise ? 'checked' : ''}> Contenu sponsorisé (tiers)</label>
      </div>
      <p class="consent">En publiant, tu acceptes la <a href="${MUSIQUE}" target="_blank" rel="noopener">Music Usage Confirmation</a> de TikTok${p.contenu_sponsorise ? ` et sa <a href="${MARQUE}" target="_blank" rel="noopener">Branded Content Policy</a>` : ''}. ${p.contenu_sponsorise || p.promo_marque ? 'La vidéo portera la mention « ' + (p.contenu_sponsorise ? 'Partenariat rémunéré' : 'Contenu promotionnel') + ' ».' : ''}</p>
      <div class="ligne">
        ${p.valide
          ? `<button class="secondaire petit" data-act="retirer">Retirer la validation</button>`
          : `<button class="primaire petit" data-act="valider" ${p.confidentialite ? '' : 'disabled'}>Valider cette vidéo</button>`}
        <button class="danger petit" data-act="supprimer">Supprimer</button>
      </div>
    </div>
  </div>`;
}

function afficher() {
  entete();
  const a_valider = [], programmees = [], historique = [];
  file.forEach((p, i) => {
    if (p.statut && p.statut !== 'prévue') historique.push([p, i]);
    else if (p.valide) programmees.push([p, i]);
    else a_valider.push([p, i]);
  });
  const tri = (x, y) => Date.parse(x[0].date) - Date.parse(y[0].date);
  a_valider.sort(tri); programmees.sort(tri); historique.sort((x, y) => -tri(x, y));
  const audite = config.audite;
  $('#app').innerHTML = `
    ${audite ? '' : `<p class="alerte">Cadence n'est pas encore validé par TikTok : les vidéos sont publiées en <b>privé</b> (« Moi uniquement ») et le compte TikTok doit être privé.</p>`}
    ${Object.keys(comptes).length ? '' : `<p class="alerte">Aucun compte TikTok connecté. Utilise « Connecter un compte TikTok ».</p>`}

    <h2>À valider <span class="compteur">${a_valider.length}</span></h2>
    ${a_valider.length ? `<div class="lot">
        <span>Pour tout le lot :</span>
        <select id="visTout">${optionsVisibilite(Object.values(comptes)[0], '')}</select>
        <label style="color:var(--ink);display:flex;gap:6px;align-items:center"><input type="checkbox" id="comTout"> Commentaires</label>
        <label style="color:var(--ink);display:flex;gap:6px;align-items:center"><input type="checkbox" id="duoTout"> Duo</label>
        <label style="color:var(--ink);display:flex;gap:6px;align-items:center"><input type="checkbox" id="colTout"> Collage</label>
        <button class="primaire" id="toutValider" disabled>Tout valider (${a_valider.length})</button>
      </div>
      <div class="grille">${a_valider.map(([p, i]) => carte(p, i)).join('')}</div>`
      : '<p class="info">Rien à valider pour le moment. Le prochain lot sera préparé par Claude.</p>'}

    <h2>Programmées <span class="compteur">${programmees.length}</span></h2>
    ${programmees.length ? `<div class="grille">${programmees.map(([p, i]) => carte(p, i)).join('')}</div>` : '<p class="vide">Aucune vidéo programmée.</p>'}

    <h2>Historique <span class="compteur">${historique.length}</span></h2>
    ${historique.length ? `<table><tr><th>Date</th><th>Vidéo</th><th>Statut</th></tr>${historique.map(([p]) => `<tr>
        <td>${esc(dateLocale(p.publiee_le || p.date))}</td>
        <td>${esc((p.texte || p.id).split('\n')[0].slice(0, 80))}</td>
        <td><span class="etiquette ${p.statut === 'publiée' ? 'ok' : p.statut === 'échec' || p.statut === 'manquée' ? 'ko' : ''}">${esc(p.statut)}</span>${p.note ? `<br><small class="vide">${esc(p.note)}</small>` : ''}</td>
      </tr>`).join('')}</table>` : '<p class="vide">Rien de publié pour l’instant.</p>'}
  `;
  brancher();
}

function brancher() {
  document.querySelectorAll('.carte').forEach((el) => {
    const i = +el.dataset.i, p = file[i];
    el.querySelectorAll('[data-k]').forEach((ch) => {
      ch.addEventListener('change', async () => {
        const k = ch.dataset.k;
        p[k] = ch.type === 'checkbox' ? ch.checked : k === 'date' ? depuisInput(ch.value) : ch.value;
        if (k === 'confidentialite') { const b = el.querySelector('[data-act=valider]'); if (b) b.disabled = !p.confidentialite; }
        if (p.valide) { p.valide = false; }
        await sauver(`Modification : ${p.id}`).catch(() => {}); afficher();
      });
    });
    el.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', async () => {
      const act = b.dataset.act;
      if (act === 'valider') { if (!p.confidentialite) return; p.valide = true; p.valide_le = new Date().toISOString(); }
      if (act === 'retirer') { p.valide = false; }
      if (act === 'supprimer') { if (!confirm('Supprimer cette vidéo de la file ?')) return; file.splice(i, 1); }
      await sauver(`${act} : ${p.id}`).catch(() => {}); afficher();
    }));
  });
  const vis = $('#visTout'), btn = $('#toutValider');
  if (vis && btn) {
    vis.addEventListener('change', () => (btn.disabled = !vis.value));
    btn.addEventListener('click', async () => {
      if (!vis.value) return;
      const n = file.filter((p) => !p.valide && (!p.statut || p.statut === 'prévue')).length;
      if (!confirm(`Valider les ${n} vidéos avec la visibilité « ${VISIBILITES[vis.value] || vis.value} » ?`)) return;
      const maintenant = new Date().toISOString();
      file.forEach((p) => {
        if (p.valide || (p.statut && p.statut !== 'prévue')) return;
        p.confidentialite = vis.value; p.commentaires = $('#comTout').checked; p.duo = $('#duoTout').checked; p.collage = $('#colTout').checked;
        p.valide = true; p.valide_le = maintenant;
      });
      await sauver(`Validation du lot (${n} vidéos)`).catch(() => {}); afficher();
    });
  }
}

$('#deconnexion').onclick = () => { if (!confirm('Oublier la clé GitHub sur cet appareil ?')) return; try { localStorage.removeItem('cadence_jeton'); } catch (e) {} jeton = null; ecranCle(); };
charger();
</script>
</body>
</html>
