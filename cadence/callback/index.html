<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Cadence — Connexion TikTok</title>
<style>
  [hidden]{display:none!important}
  body{margin:0;background:#172A3A;color:#F5F3EE;font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:560px;margin:0 auto;padding:56px 24px;text-align:center}
  h1{font-size:1.5rem}
  code{display:block;word-break:break-all;background:#0f1e2a;border:1px solid #2c4356;border-radius:10px;padding:14px;margin:16px 0;font-size:.9rem;color:#4FF0D2}
  button{background:#4FF0D2;color:#172A3A;border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:1rem}
  .muted{color:#b7c0c7;font-size:.92rem}
</style>
</head>
<body>
<main>
<h1 id="titre">Connexion à Cadence</h1>
<p id="texte">Chargement…</p>
<code id="code" hidden></code>
<p><button id="copier" hidden>Copier le code</button></p>
<p class="muted">Ce code expire après quelques minutes et ne sert qu'une fois.</p>
</main>
<script>
  var p = new URLSearchParams(location.search);
  var code = p.get('code'), err = p.get('error'), state = p.get('state');
  // Garde le code quelques minutes si la page est rechargée (il ne sert qu'une fois de toute façon).
  try {
    if (code) sessionStorage.setItem('cadence_code', JSON.stringify({ code: code, state: state, t: Date.now() }));
    else if (!err) {
      var g = JSON.parse(sessionStorage.getItem('cadence_code') || 'null');
      if (g && Date.now() - g.t < 10 * 60 * 1000) { code = g.code; state = g.state; }
    }
  } catch (e) {}
  history.replaceState(null, '', location.pathname);
  var t = document.getElementById('texte');
  if (code) {
    document.getElementById('titre').textContent = '✅ Compte TikTok autorisé';
    t.textContent = 'Copie ce code et colle-le à Claude pour terminer la connexion de Cadence.';
    var c = document.getElementById('code'); c.textContent = code + (state ? '\n(state : ' + state + ')' : ''); c.hidden = false;
    var b = document.getElementById('copier'); b.hidden = false;
    b.onclick = function(){ navigator.clipboard.writeText(code).then(function(){ b.textContent = 'Copié ✓'; }); };
  } else if (err) {
    document.getElementById('titre').textContent = 'Connexion refusée';
    t.textContent = 'TikTok a renvoyé : ' + err + (p.get('error_description') ? ' — ' + p.get('error_description') : '');
  } else {
    t.textContent = 'Cette page reçoit la réponse de TikTok après la connexion d’un compte à Cadence.';
  }
</script>
</body>
</html>
